version: 2

expected:
  # Optional user-supplied ground truth for calibration/validation.
  # This never instructs the extractor to fabricate component objects.
  components: null

preprocess:
  adaptive_threshold:
    block_size: 31
    c: 7

detection:
  horizontal_kernel_length: 25
  vertical_kernel_length: 25
  minimum_segment_length: 12
  minimum_component_area: 8

geometry:
  endpoint_snap_tolerance: 4.0
  collinear_angle_tolerance_degrees: 1.0
  gap_tolerance: 4.0

cables:
  enabled: true
  heavy_threshold_px: 4.2

validation:
  deterministic_serialization: true
  overlay_required: true
